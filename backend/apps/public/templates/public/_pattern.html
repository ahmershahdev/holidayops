<div class="pattern" aria-hidden="true"><svg viewBox="0 0 {{ pattern.width }} {{ pattern.height }}" preserveAspectRatio="xMidYMid slice"><defs>{% for name, d in pattern.defs %}<path id="{{ pattern.code }}-{{ name }}" d="{{ d }}"/>{% endfor %}</defs>{% for row in pattern.rows %}<g class="pattern-row">{% for t in row %}<use href="#{{ pattern.code }}-{{ t.motif }}" x="{{ t.x }}" y="{{ t.y }}" fill="{{ t.colour }}"{% if t.turn %} transform="rotate({{ t.turn }} {{ t.x|add:20 }} {{ t.y|add:20 }})"{% endif %}/>{% endfor %}</g>{% endfor %}</svg></div>
