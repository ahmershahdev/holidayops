{% load i18n %}<div class="switches">
  <nav class="langs" aria-label="{% translate 'Language' %}">{% for code, path in languages %}<a href="{{ path }}" hreflang="{{ code }}" lang="{{ code }}"{% if code == lang %} aria-current="true"{% endif %}>{% if code == "ur" %}اردو{% elif code == "ar" %}عربي{% else %}EN{% endif %}</a>{% endfor %}</nav>
  <nav class="themes" aria-label="{% translate 'Theme' %}">
    <a href="/theme/light/?next={{ theme_next }}" rel="nofollow"{% if theme == "light" %} aria-current="true"{% endif %} title="{% translate 'Light' %}"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><span class="sr-only">{% translate "Light" %}</span></a>
    <a href="/theme/system/?next={{ theme_next }}" rel="nofollow"{% if theme == "system" %} aria-current="true"{% endif %} title="{% translate 'Match my device' %}"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg><span class="sr-only">{% translate "Match my device" %}</span></a>
    <a href="/theme/dark/?next={{ theme_next }}" rel="nofollow"{% if theme == "dark" %} aria-current="true"{% endif %} title="{% translate 'Dark' %}"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg><span class="sr-only">{% translate "Dark" %}</span></a>
  </nav>
</div>
