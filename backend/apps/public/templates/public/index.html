{% extends "public/base.html" %}{% load i18n flags %}
{% block content %}
<h1>{{ title }}</h1>
<p class="lead">{{ description }}</p>
<ul class="countries">
{% for code, name, path in countries %}<li><a href="{{ path }}">{% flag code %}<span>{{ name }}</span></a></li>
{% endfor %}</ul>
{% endblock %}
