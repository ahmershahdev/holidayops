      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignupRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SignupRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SignupRequest'
        required: true
      security:
      - cookieAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/v1/business-days/add/:
    get:
      operationId: business_days_add_retrieve
      parameters:
      - in: query
        name: calendar
        schema:
          type: string
          format: uuid
        description: A company calendar id, instead of country.
      - in: query
        name: categories
        schema:
          type: string
          maxLength: 200
        description: 'Comma-separated. Default: public.'
      - in: query
        name: country
        schema:
          type: string
          minLength: 1
          maxLength: 3
        description: ISO 3166-1 alpha-2 code, e.g. PK.
      - in: query
        name: date
        schema:
          type: string
          format: date
        required: true
      - in: query
        name: days
        schema:
          type: integer
          maximum: 1000
          minimum: -1000
        required: true
      - in: query
        name: language
        schema:
          type: string
          maxLength: 10
        description: Defaults to the country's language.
      - in: query
        name: subdiv
        schema:
          type: string
          maxLength: 10
      tags:
      - business-days
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddResult'
          description: ''
