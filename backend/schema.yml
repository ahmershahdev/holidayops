components:
  schemas:
    AddResult:
      type: object
      properties:
        start:
          type: string
          format: date
        days:
          type: integer
        result:
          type: string
          format: date
      required:
      - days
      - result
      - start
    AuditLog:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        action:
          type: string
          maxLength: 50
        target:
          type: string
          maxLength: 200
        actor:
          type: string
          format: email
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - action
      - actor
      - created_at
      - id
      - target
    BetweenResult:
      type: object
      properties:
        start:
          type: string
          format: date
        end:
          type: string
          format: date
        business_days:
          type: integer
          description: Inclusive of both start and end.
      required:
      - business_days
      - end
      - start
    Calendar:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 120
        slug:
          type: string
          readOnly: true
          pattern: ^[-a-zA-Z0-9_]+$
        is_public:
          type: boolean
        language:
          type: string
          maxLength: 10
        weekend:
          type: array
          items:
            type: integer
            maximum: 6
            minimum: 0
          nullable: true
          description: Weekday numbers (Monday = 0). Null uses the first source's
            weekend.
          maxItems: 6
        sources:
          type: array
          items:
            $ref: '#/components/schemas/Source'
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - name
      - slug
