name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: holidayops
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=5s --health-retries=20
    env:
      MYSQL_USER: root
      MYSQL_PASSWORD: root
      MYSQL_HOST: 127.0.0.1
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy .
      - name: Translations are complete and compiled
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq gettext
          for lang in ur ar; do
            dir=locale/$lang/LC_MESSAGES
            msgfmt --check -o "$RUNNER_TEMP/$lang.mo" "$dir/django.po"
            diff <(msgunfmt "$dir/django.mo") <(msgunfmt "$RUNNER_TEMP/$lang.mo") || { echo "$dir/django.mo is stale: run compilemessages"; exit 1; }
          done
          uv run python manage.py makemessages -l ur -l ar --ignore=.venv --ignore=tests --no-obsolete --no-location
          git diff --exit-code -I'POT-Creation-Date' -- 'locale/*.po' || { echo "Source strings changed: run makemessages and translate"; exit 1; }
          for lang in ur ar; do
            missing=$(msgattrib --untranslated --no-wrap locale/$lang/LC_MESSAGES/django.po | grep -c '^msgid "[^"]' || true)
            test "$missing" -eq 0 || { echo "$lang has $missing untranslated messages"; exit 1; }
          done
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
      - name: OpenAPI schema is committed and up to date
        run: |
          uv run python manage.py spectacular --file /tmp/schema.yml --validate --fail-on-warn
          diff -u schema.yml /tmp/schema.yml
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
      - run: uv run pytest tests/core --cov=apps/core --cov-branch --cov-fail-under=100
      - run: uv run pytest --cov=apps --cov-branch
      - run: uvx pip-audit --strict -r <(uv export --frozen --no-hashes --no-emit-project)

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high

  codeql:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: python, javascript-typescript, actions
      - uses: github/codeql-action/analyze@v4
