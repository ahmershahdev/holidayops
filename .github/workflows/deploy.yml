name: Deploy

# Every push to main builds the production image and pushes it to GHCR. The Azure job stays
# skipped until the repository variable AZURE_DEPLOY is "true"; setup is in docs/deployment.md.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.name.outputs.image }}
    steps:
      - uses: actions/checkout@v7
      - id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ steps.name.outputs.image }}:${{ github.sha }}
            ${{ steps.name.outputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  azure:
    needs: image
    if: vars.AZURE_DEPLOY == 'true'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      IMAGE: ${{ needs.image.outputs.image }}:${{ github.sha }}
      GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
    steps:
      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Run migrations
        run: |
          az containerapp job update -n holidayops-migrate -g "$GROUP" --image "$IMAGE"
          run=$(az containerapp job start -n holidayops-migrate -g "$GROUP" --query name -o tsv)
          for _ in $(seq 1 60); do
            status=$(az containerapp job execution show -n holidayops-migrate -g "$GROUP" \
              --job-execution-name "$run" --query properties.status -o tsv)
            case "$status" in
              Succeeded) exit 0 ;;
              Failed|Stopped|Degraded) echo "Migration $status"; exit 1 ;;
            esac
            sleep 10
          done
          echo "Migration timed out"; exit 1
      - name: Roll out web, worker and beat
        run: |
          for app in holidayops-web holidayops-worker holidayops-beat; do
            az containerapp update -n "$app" -g "$GROUP" --image "$IMAGE" --output none
          done
