version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: uv
    directory: /backend
    schedule:
      interval: monthly
    groups:
      backend:
        patterns: ["*"]
    ignore:
      # Stay on the Django LTS line; move to the next LTS in a planned PR.
      - dependency-name: django
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: monthly
    groups:
      frontend:
        patterns: ["*"]
    ignore:
      # typescript-eslint supports TypeScript < 6.1; lift this when it supports 7.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
